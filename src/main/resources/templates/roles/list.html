<!DOCTYPE html>
<html>
<head>
    <title>Visitors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>Listado de Roles</h2>
<div class="d-flex justify-content-between align-items-center mb-3">

    <button class="btn btn-primary" id = "btn-save" onclick="OpenModal()">
        + Nuevo Roool
    </button>
</div>
<table class="table table-bordered mt-3">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Empresa</th>
        <th>Entrada</th>
    </tr>
    </thead>
    <tbody id="RolesTable">
    </tbody>
</table>

<!-- Modal -->
<div class="modal fade" id="roleModal" tabindex="-1">
  <div class="modal-dialog">

    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Nuevo Rol</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      
      <div class="modal-body">
        <form id="roleForm">
          
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" id="roleName" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Descripción</label>
            <input type="text" id="roleDescription" class="form-control">
          </div>

        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="saveRole()">Guardar</button>
      </div>

    </div>
  </div>
</div>



<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="/js/roles/roles.js"></script>

</body>
</html>
